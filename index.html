<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>나의 진로 노선도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 지하철 역 안내판 띠 + 4개 역(적성→학과→과목→노선도) 단계 화면, 교과마다 고유 노선 색, 2·3학년 4개 학기 노선도 */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E9EDF2; --ink:#14202F; --muted:#5A6676; --line:#D6DCE4;
  --sign:#13233D; --signfg:#FFFFFF; --signmuted:#B8C3D3; --yellow:#FFC531; --accent:#1A56C9; --warn:#C2410C; --ok:#15803D; --info:#1D6FA8;
  --tR:#E2572B; --tI:#2B7BBF; --tA:#9150B8; --tS:#2E9E57; --tE:#C98E00; --tC:#5F6E80;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141D; --surface:#161F2B; --surface2:#1F2A39; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2B3747;
  --sign:#0A1424; --signfg:#F3F6FA; --signmuted:#93A1B6; --yellow:#FFCD4A; --accent:#6A9BFF; --warn:#FB923C; --ok:#4ADE80; --info:#60A5FA;
  --tR:#F07A52; --tI:#5AA6E6; --tA:#B47FD8; --tS:#4CC27A; --tE:#F2B829; --tC:#8C9AAC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#161F2B; --surface2:#1F2A39; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2B3747;
  --sign:#0A1424; --signfg:#F3F6FA; --signmuted:#93A1B6; --yellow:#FFCD4A; --accent:#6A9BFF; --warn:#FB923C; --ok:#4ADE80; --info:#60A5FA;
  --tR:#F07A52; --tI:#5AA6E6; --tA:#B47FD8; --tS:#4CC27A; --tE:#F2B829; --tC:#8C9AAC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 역 안내판 */
.sign{background:var(--sign);color:var(--signfg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 3px 0 var(--yellow)}
.sign .in{padding-block:10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:400;white-space:nowrap}
.brand .lno{width:30px;height:30px;border-radius:50%;background:var(--yellow);color:#13233D;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;flex:none}
.route{display:flex;align-items:flex-start;flex:1;min-width:270px;position:relative}
.route::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:4px;background:rgba(255,255,255,.2);border-radius:2px}
.route .fill{position:absolute;left:12.5%;top:13px;height:4px;background:var(--yellow);border-radius:2px;transition:width .4s}
.stn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;position:relative;z-index:1;color:var(--signfg)}
.stn i{width:30px;height:30px;border-radius:50%;background:var(--sign);border:4px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:600}
.stn span{font-size:12px;color:var(--signmuted);white-space:nowrap}
.stn.done i{border-color:var(--yellow);background:var(--yellow);color:#13233D}
.stn.cur i{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,197,49,.3)}
.stn.cur span{color:var(--signfg);font-weight:700}

main{padding-block:26px 72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.y{background:var(--yellow);color:#13233D}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:700;white-space:nowrap}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:36px 0 12px}
.sh h2{font-size:26px}
.h3{font-size:20px;margin-bottom:10px}

/* 1역 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.lead{font-size:17px;max-width:34em;margin:14px 0 20px}
.legs{display:grid;gap:10px}
.leg{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.leg .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff}
.leg b{display:block}
.leg small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.namebox input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.facts div{border-top:3px solid var(--ink);padding-top:6px}
.facts b{font-family:var(--f-mono);font-size:24px;display:block;line-height:1.1}
.facts small{color:var(--muted);font-size:12px}

.qwrap{max-width:740px;margin:0 auto}
.parts{display:flex;gap:6px;margin-bottom:6px}
.parts span{flex:1;font-size:12px;font-weight:700;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:3px}
.parts span.on{color:var(--ink);border-color:var(--accent)}
.parts span.dn{border-color:var(--ok)}
.track{position:relative;height:30px;margin:4px 0 16px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:4px;background:var(--line);border-radius:2px}
.track .tf{position:absolute;left:0;top:13px;height:4px;background:var(--accent);border-radius:2px;transition:width .3s}
.track .train{position:absolute;top:3px;width:40px;height:24px;margin-left:-20px;border-radius:7px 13px 7px 7px;background:var(--accent);transition:left .3s;display:grid;place-items:center;color:#fff;font-size:11px;font-family:var(--f-mono)}
.qcard{text-align:center;padding:30px 20px}
.qcard .qn{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.qcard h2{font-size:clamp(22px,4vw,30px);margin:10px auto 26px;max-width:22em;line-height:1.35}
.lik{display:flex;justify-content:center;align-items:center;gap:clamp(8px,3vw,22px)}
.lik button{border-radius:50%;border:3px solid var(--line);background:var(--surface);transition:transform .12s,background .12s}
.lik button:hover{transform:scale(1.08)}
.lik button.on{background:var(--accent);border-color:var(--accent)}
.lik .s1,.lik .s5{width:56px;height:56px}.lik .s2,.lik .s4{width:46px;height:46px}.lik .s3{width:38px;height:38px}
.lik .s4,.lik .s5{border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
.likl{display:flex;justify-content:space-between;max-width:420px;margin:10px auto 0;font-size:13px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.rates{display:grid;gap:6px;margin:16px 0}
.rate{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.rate b{display:flex;align-items:center;gap:8px;font-size:14px}
.rate b i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;font-size:12px}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}

/* 2역 결과 */
.res{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center}
.radar{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.radar .g{fill:none;stroke:var(--line)}
.radar .ax{stroke:var(--line)}
.radar .lb{font-family:var(--f-display);font-size:15px;fill:var(--ink)}
.radar .sv{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.radar .pg{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:2.5}
.code{display:inline-flex;gap:4px;margin:4px 0 6px}
.code b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:20px;font-weight:400}
.res h2{font-size:clamp(26px,4.5vw,40px);line-height:1.2}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .t span{display:block;height:100%;border-radius:5px}
.types3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.tbox{border-left:4px solid var(--c);padding:4px 0 4px 12px}
.tbox b{display:block}
.tbox p{font-size:14px;color:var(--muted)}
.tbox ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.hm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.hm div{border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;font-weight:700;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.majors{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mj{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mj.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.mj .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.mj h3{font-size:20px;line-height:1.25}
.mj .intro{font-size:13.5px;color:var(--muted)}
.rank{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pct{font-family:var(--f-mono);font-weight:600;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.pct small{font-size:12px;color:var(--muted)}
.sub3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sub3 div{font-size:11.5px;color:var(--muted)}
.sub3 .m{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:2px}
.sub3 .m span{display:block;height:100%}
.why{font-size:13px;background:var(--surface2);border-radius:8px;padding:6px 10px}
.mj .acts{display:flex;gap:8px;margin-top:auto}
.mj .acts .btn{flex:1}
.detail{font-size:13px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.sbj{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;margin:2px 2px 0 0;border:1.5px solid var(--c);color:var(--ink)}
.sbj.core{background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;width:220px;max-width:100%}
.list{display:grid;gap:6px;margin-top:12px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 140px 58px 40px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.li .meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.li .meter span{display:block;height:100%;background:var(--accent)}
.star{border:0;background:none;font-size:22px;color:var(--muted);padding:0;line-height:1}
.star.on{color:var(--tE)}
.cmpwrap{overflow-x:auto}
.cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.cmp th,.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-family:var(--f-display);font-weight:400;font-size:16px}
.cmp td .k{color:var(--tE);font-weight:700}
.pickbar{position:sticky;bottom:0;z-index:5;margin-top:24px;background:var(--sign);color:var(--signfg);border-radius:14px 14px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pickbar .ps{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pickbar .ps span{background:rgba(255,255,255,.13);padding:4px 10px;border-radius:999px;font-size:13px}

/* 3역 노선도 */
.mapScroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.map{min-width:900px;padding:14px 16px 6px}
.mh,.mrow{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:0 10px}
.mh div{font-family:var(--f-display);font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.mh div small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mh div:first-child{border:0}
.mrow{position:relative;padding:9px 0;border-bottom:1px dashed var(--line)}
.mrow::before{content:"";position:absolute;left:106px;right:0;top:22px;height:6px;border-radius:3px;background:var(--lc);opacity:.85}
.mlabel{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;height:32px}
.mlabel i{width:20px;height:20px;border-radius:50%;background:var(--lc);flex:none}
.mcell{display:flex;flex-direction:column;align-items:flex-start;gap:5px;position:relative;z-index:1;min-width:0}
.st{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--lc);border-radius:999px;padding:3px 9px 3px 4px;font-size:12.5px;line-height:1.3;max-width:100%;text-align:left}
.st i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--lc);flex:none}
.st.core i{background:var(--lc)}
.st.base{border-style:dashed;color:var(--muted)}
.st.bad{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 55%,transparent)}
.st.sel{outline:3px solid var(--yellow);outline-offset:1px}
.st sup{font-size:9px;font-weight:700;color:var(--info);margin-left:-2px}
button.st:hover{background:color-mix(in srgb,var(--lc) 12%,var(--surface))}
.load{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:0 10px;padding:8px 0;font-size:12px;color:var(--muted)}
.load .lb{height:6px;border-radius:3px;background:var(--surface2);margin-top:4px;overflow:hidden}
.load .lb span{display:block;height:100%;background:var(--accent)}
.term{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0 10px}
.term .tl{font-family:var(--f-display);font-size:16px;width:96px}
.term .tm{background:var(--sign);color:var(--signfg);border-radius:8px;padding:6px 12px;font-family:var(--f-display);font-size:17px;border-bottom:4px solid var(--yellow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);display:inline-block}
.legend i.f{background:var(--muted)}
.legend sup{color:var(--info);font-weight:700}
.selpanel{margin-top:12px;border:2px solid var(--yellow);border-radius:14px;background:var(--surface);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px}
.selpanel h3{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.semb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start}
.semb button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.semb button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.warns{display:grid;gap:8px}
.wn{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface));padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px}
.wn.info{border-color:var(--info);background:color-mix(in srgb,var(--info) 8%,var(--surface))}
.wn.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface2);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-mono);font-size:24px;line-height:1.1}
.stats small{color:var(--muted);font-size:11.5px}
.csat{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.csat span{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line)}
.csat span.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.cat details{border-bottom:1px solid var(--line)}
.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer;font-weight:700}
.cat summary::-webkit-details-marker{display:none}
.cat summary i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.cat summary small{margin-left:auto;color:var(--muted);font-weight:400}
.tier{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:0 4px 10px;align-items:start}
.tier>span{font-size:12px;color:var(--muted);padding-top:6px}
.tier div{display:flex;flex-wrap:wrap;gap:6px}
.sc{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.sc.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}

/* 4역 */
.report{display:grid;gap:16px}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:center;background:var(--sign);color:var(--signfg);border-radius:16px;padding:24px;border-bottom:6px solid var(--yellow)}
.rhead .radar .lb{fill:var(--signfg)}.rhead .radar .sv{fill:var(--signmuted)}.rhead .radar .g,.rhead .radar .ax{stroke:rgba(255,255,255,.2)}
.rhead .radar .pg{fill:rgba(255,197,49,.28);stroke:var(--yellow)}
.rhead h2{font-size:clamp(26px,4vw,38px);line-height:1.2}
.rhead .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rhead .tags span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:13px}
.tk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.tk:last-child{border:0}
.tk .p{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--accent)}
.semtbl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.semtbl>div{background:var(--surface2);border-radius:10px;padding:10px;min-width:0}
.semtbl h4{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.semtbl h4 small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px}
.todo li::before{content:"";width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
.copyarea{width:100%;min-height:220px;font:13px/1.6 var(--f-body);border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}

@media (max-width:860px){

}

function corr(a,b){const ma=a.reduce((x,y)=>x+y,0)/a.length,mb=b.reduce((x,y)=>x+y,0)/b.length;let n=0,da=0,db=0;for(let i=0;i<a.length;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?n/Math.sqrt(da*db):0}
function rias(){const o={};TYPES.forEach(t=>{let s=0;QUIZ.forEach((q,i)=>{if(q.p==='A'&&q.t===t)s+=(S.ans[i]??3)});o[t]=Math.round((s-5)/20*100)});return o}
function mis(){const o={};MIK.forEach(k=>{let s=0;QUIZ.forEach((q,i)=>{if(q.p==='B'&&q.t===k)s+=(S.ans[i]??3)});o[k]=Math.round((s-2)/8*100)});return o}
const ord=(o,keys)=>keys.slice().sort((a,b)=>o[b]-o[a]||keys.indexOf(a)-keys.indexOf(b));
let CACHE=null;
function scoreAll(){const sc=rias(),mi=mis();const key=JSON.stringify([S.ans,S.rate]);if(CACHE&&CACHE.key===key)return CACHE;
 const p=TYPES.map(t=>sc[t]),mv=MIK.map(k=>mi[k]);
 const list=MAJ.map(m=>{
  const it=clamp(50+48*corr(p,m.v));
  const fit=MIK.reduce((a,k)=>a+m.mi[k]*mi[k],0);
  const ap=clamp(.6*fit+.4*(50+50*corr(MIK.map(k=>m.mi[k]),mv)));
  let w=0,s=0;m.core.forEach(x=>{const g=SUBJ[x].g;if(S.rate[g]){s+=S.rate[g]*2;w+=2}});m.rec.forEach(x=>{const g=SUBJ[x].g;if(S.rate[g]){s+=S.rate[g];w+=1}});
  const sb=w?clamp((s/w-1)/4*100):50;
  return{m,it,ap,sb,p:clamp(.5*it+.25*ap+.25*sb)}});
 list.sort((a,b)=>b.p-a.p);list.forEach((x,i)=>x.rank=i+1);
 CACHE={key,sc,mi,list,by:Object.fromEntries(list.map(x=>[x.m.id,x]))};return CACHE}

 const mt=ord(C.mi,MIK).slice(0,3).filter(k=>m.mi[k]>=.16);if(mt.length)a.push(`<b>${mt.map(k=>MI[k].n).join('·')}</b> 강점이 쓰여요`);

 return a.join(' · ')||'성향 조합이 비슷한 편이에요'}

   <p class="note" style="margin-top:12px">학점은 과목당 4학점(체육·예술·교양 3학점)으로 어림했어요. 학교마다 개설 과목·학기 배치·학점이 다르니 수강 신청 전 담임·교과·진로 선생님과 꼭 확인하세요. 대학별 권장 과목은 각 대학 발표 자료를 기준으로 하세요.</p>
   <div class="row" style="margin-top:12px"><button class="btn y" data-act="goto" data-v="4">나의 노선도 완성 →</button></div></div>
  <div class="card cat"><h3 class="h3" style="margin-bottom:2px">과목 담기·빼기</h3><p class="note">★ 담은 학과의 핵심 · ☆ 권장 · <b style="color:var(--info)">수</b> 수능 범위. 과목에 손을 대면 담은 학과 이름이 보여요.</p>
   ${GROUPS.map(G=>{const n=['일반','진로','융합'].reduce((a,t)=>a+G[t].filter(s=>S.plan[s]).length,0);const hasRec=['일반','진로','융합'].some(t=>G[t].some(s=>R[s]));
    return`<details ${hasRec||n?'open':''}><summary style="--c:${G.c}"><i></i>${G.g}<small>${n}과목 담음</small></summary>
    ${['일반','진로','융합'].filter(t=>G[t].length).map(t=>`<div class="tier"><span>${t}</span><div>${G[t].map(s=>{const r=R[s];const mk=r?(r.core.length?'★':'☆'):'';return`<button class="sc ${S.plan[s]?'on':''}" style="--c:${G.c}" data-act="toggle" data-v="${esc(s)}" aria-pressed="${!!S.plan[s]}" title="${esc(SD[s]||'')}${r?' / '+esc([...r.core,...r.rec].join(', ')):''}">${s}${mk?`<em>${mk}</em>`:''}${CSATS.includes(s)?'<sup>수</sup>':''}</button>`}).join('')}</div></div>`).join('')}</details>`}).join('')}
  </div></div>`}
function selPanel(s,R){const x=SUBJ[s],r=R[s];const pre=PRE[s]||[];const next=Object.keys(PRE).filter(k=>PRE[k].includes(s));
 return`<div class="selpanel"><div><p class="eyebrow">${x.g} · ${x.t}선택</p><h3>${s}</h3><p style="margin-top:4px">${SD[s]||''}</p>
  <dl class="kv"><dt>평가</dt><dd>${evalOf(s)}</dd><dt>학점</dt><dd>${cr(s)}학점 (기본, 학교별 ±1)</dd>
  ${r&&r.core.length?`<dt>핵심인 학과</dt><dd>${r.core.join(', ')}</dd>`:''}${r&&r.rec.length?`<dt>권장인 학과</dt><dd>${r.rec.join(', ')}</dd>`:''}
  ${pre.length?`<dt>먼저 들을 과목</dt><dd>${pre.join(', ')}</dd>`:''}${next.length?`<dt>이어지는 과목</dt><dd>${next.join(', ')}</dd>`:''}
  ${CSATS.includes(s)?'<dt>수능</dt><dd>2028 수능 출제 범위</dd>':''}</dl></div>
  <div><p class="eyebrow" style="margin-bottom:6px">학기 옮기기</p><div class="semb">${SEMS.map(m=>`<button class="${S.plan[s]===m?'on':''}" data-act="move" data-v="${m}">${SEMN[m]}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="toggle" data-v="${esc(s)}">노선에서 빼기</button><button class="btn ghost sm" data-act="unsel">닫기</button></div></div></div>`}

function reportText(){const C=scoreAll(),sc=C.sc,mi=C.mi,od=ord(sc,TYPES),mo=ord(mi,MIK);const P=Object.keys(S.plan);
 let t=`[나의 진로 노선도] ${S.name||''} (${new Date().toLocaleDateString('ko-KR')})\n\n■ 흥미 유형: ${od.slice(0,3).join('')} · ${T[od[1]].adj} ${T[od[0]].n}\n  `+od.map(x=>`${T[x].n} ${sc[x]}`).join(' / ')+`\n■ 강점: `+mo.slice(0,3).map(k=>`${MI[k].n}(${mi[k]})`).join(', ')+`\n■ 좋아하는 교과: `+(RATE_G.filter(g=>S.rate[g]>=4).join(', ')||'없음')+`\n\n■ 선택한 학과\n`;
 S.picks.forEach((id,i)=>{const x=C.by[id];t+=`  ${i+1}. ${x.m.n} 일치도 ${x.p}% (흥미 ${x.it}·강점 ${x.ap}·교과 ${x.sb})\n     관련 직업: ${x.m.jobs}\n     탐구 아이디어: ${x.m.q.join(' / ')}\n`});
 SEMS.forEach(sem=>{const L=P.filter(s=>S.plan[s]===sem);t+=`\n■ ${SEMN[sem]} (${semCr(sem)}학점)\n  `+(L.length?L.join(', '):'-')});
 const w=warnings();if(w.length)t+=`\n\n■ 더 살펴볼 점\n`+w.map(x=>'  - '+x.txt.replace(/<[^>]+>/g,'')).join('\n');
 return t}

function r4(){const el=document.getElementById('s4');const C=scoreAll(),sc=C.sc,mi=C.mi,od=ord(sc,TYPES),a=od[0],b=od[1];const mo=ord(mi,MIK);const P=Object.keys(S.plan);const w=warnings();const R=recMap();
 const first=S.picks.length?MAJ[S.picks[0]]:null;const firstG=first?[...new Set(first.core.map(s=>SUBJ[s].g))].slice(0,2):[];
 el.innerHTML=`<div class="report">
 <div class="rhead"><div><p class="eyebrow" style="color:var(--yellow)">나의 진로 노선도 · ${new Date().toLocaleDateString('ko-KR')}</p>
  <h2>${esc(S.name||'나')}는<br>${T[b].adj} ${T[a].n}</h2>
  <p style="opacity:.88;margin-top:10px">${T[a].d}</p>
  <div class="tags"><span>흥미 ${od.slice(0,3).join('')}</span>${mo.slice(0,3).map(k=>`<span>강점 · ${MI[k].n}</span>`).join('')}${RATE_G.filter(g=>S.rate[g]>=4).map(g=>`<span>좋아함 · ${g}</span>`).join('')}</div></div>${radar(sc)}</div>
 <div class="cols2" style="margin-top:0">
  <div class="card"><h3 class="h3">환승한 학과</h3>${S.picks.map(id=>{const x=C.by[id];return`<div class="tk"><span class="p">${x.p}%</span><div><b style="font-size:17px">${x.m.n}</b> <span class="chip">${x.m.k}</span><div class="note">흥미 ${x.it} · 강점 ${x.ap} · 교과 ${x.sb} · ${x.m.jobs}</div><ul style="margin:4px 0 0;padding-left:18px;font-size:14px">${x.m.q.map(q=>`<li>${q}</li>`).join('')}</ul></div></div>`}).join('')}</div>
  <div class="card"><h3 class="h3">나의 강점을 살리는 법</h3><div style="display:grid;gap:10px">${mo.slice(0,3).map(k=>`<div class="tbox" style="--c:var(--accent)"><b>${MI[k].n} <span class="num muted">${mi[k]}</span></b><p>${MI[k].tip}</p></div>`).join('')}
   <div class="tbox" style="--c:var(--t${a})"><b>${T[a].n}에게 맞는 활동</b><ul>${T[a].act.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>
 </div>
 <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 class="h3" style="margin:0">학기별 선택 과목</h3><span class="note">총 ${P.length}과목 · 약 ${P.reduce((x,s)=>x+cr(s),0)}학점</span></div>
  <div class="semtbl">${SEMS.map(sem=>`<div><h4>${SEMN[sem]}<small>${semCr(sem)}학점</small></h4>${P.filter(s=>S.plan[s]===sem).sort((x,y)=>GROUPS.findIndex(G=>G.g===SUBJ[x].g)-GROUPS.findIndex(G=>G.g===SUBJ[y].g)).map(s=>sbj(s,R[s]&&R[s].core.length)).join('')||'<span class="muted">없음</span>'}</div>`).join('')}</div>
  ${w.length?`<div class="warns" style="margin-top:12px">${w.slice(0,3).map(x=>`<div class="wn">${x.txt}</div>`).join('')}</div>`:''}</div>
 <div class="cols2" style="margin-top:0">
  <div class="card"><h3 class="h3">1학년 남은 기간 실천 체크리스트</h3><ul class="todo">
   <li>우리 학교 2·3학년 개설 과목표를 받아 노선도와 비교하기</li>
   <li>${first?first.n:'담은 학과'}의 대학별 권장 과목 발표 자료를 2곳 이상 찾아보기</li>
   <li>탐구 아이디어 하나를 골라 진로활동·자율활동 계획으로 옮기기</li>
   <li>${firstG.length?firstG.join('·')+' 공통 과목 개념을 겨울방학에 다지기':'핵심 교과의 공통 과목 기초 다지기'}</li>
   <li>관련 직업인 인터뷰나 학과 체험 프로그램 한 번 참여하기</li>
   <li>2학년 수강 신청 전 이 노선도를 들고 담임·진로 선생님과 상담하기</li></ul></div>
  <div class="card"><h3 class="h3">상담용 요약 글</h3><p class="note">상담 기록이나 활동지에 붙여 넣을 수 있게 정리했어요.</p>
   <textarea class="copyarea" id="ct" readonly aria-label="결과 텍스트">${esc(reportText())}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn" data-act="copy">결과 복사</button><button class="btn ghost sm" data-act="goto" data-v="3">노선 고치기</button><button class="btn ghost sm" data-act="reset">새 학생 시작</button></div><div id="rc"></div></div>
 </div></div>`}

function render(){renderRoute();[1,2,3,4].forEach(i=>document.getElementById('s'+i).hidden=S.step!==i);({1:r1,2:r2,3:r3,4:r4})[S.step]();save()}
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* =========================================================
   7. 이벤트
   ========================================================= */
function sample(){const prof={R:4,I:5,A:2,S:3,E:2,C:4},mp={L:3,M:5,P:4,B:2,U:2,I:3,X:4,N:4};let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
 Object.assign(S,blank(),{name:'예시 학생',ans:QUIZ.map(q=>Math.max(1,(q.p==='A'?prof:mp)[q.t]-(rnd()<.3?1:0))),rate:{'국어':3,'수학':5,'영어':3,'사회':2,'과학':4,'정보':5,'기술·가정':3,'제2외국어·한문':2,'예술':2,'체육':3},step:2});
 CACHE=null;S.picks=scoreAll().list.slice(0,2).map(x=>x.m.id)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
 const nm=document.getElementById('nm');if(nm)S.name=nm.value.trim();
 const top=()=>window.scrollTo({top:0});
 switch(a){
 case'start':if(quizDone())S.qStage='rate';else{S.qStage='quiz';S.qi=S.ans.findIndex(x=>x==null)}break;
 case'sample':sample();top();break;
 case'ans':S.ans[S.qi]=+v;CACHE=null;render();setTimeout(()=>{if(S.qStage!=='quiz')return;if(S.qi<QUIZ.length-1)S.qi++;else S.qStage='rate';render()},170);return;
 case'next':if(S.qi<QUIZ.length-1)S.qi++;break;
 case'prev':if(S.qi>0)S.qi--;else S.qStage='intro';break;
 case'backq':S.qStage='quiz';S.qi=QUIZ.length-1;break;
 case'rate':S.rate[b.dataset.g]=+v;CACHE=null;break;
 case'ratedone':if(!quizDone()){S.qStage='quiz';S.qi=S.ans.findIndex(x=>x==null);break}S.step=2;top();break;
 case'redo':S.step=1;S.qStage='quiz';S.qi=0;top();break;
 case'rerate':S.step=1;S.qStage='rate';top();break;
 case'goto':S.step=+v;if(S.step===1)S.qStage='intro';top();break;
 case'open':S.open=S.open===+v?null:+v;break;
 case'pick':{const id=+v;if(S.picks.includes(id))S.picks=S.picks.filter(x=>x!==id);else if(S.picks.length>=3){toast('학과는 최대 3개까지 담을 수 있어요');return}else S.picks=[...S.picks,id];break}
 case'filter':S.f=v;break;
 case'sort':S.sort=v;break;
 case'tostep3':if(!Object.keys(S.plan).length||S.planFor!==S.picks.join(','))buildPlan();S.step=3;top();break;
 case'rebuild':buildPlan();toast('담은 학과에 맞춰 노선을 다시 채웠어요');break;
 case'toggle':if(S.plan[v]){delete S.plan[v];if(S.sel===v)S.sel=null}else{addSub(v);toast(`${v}을(를) ${SEMN[S.plan[v]]}에 넣었어요`)}break;
 case'sel':S.sel=S.sel===v?null:v;break;
 case'unsel':S.sel=null;break;
 case'move':if(S.sel)S.plan[S.sel]=v;break;
 case'addcsat':CSATS.forEach(addSub);toast('수능 범위 과목을 넣었어요');break;
 case'copy':{const ta=document.getElementById('ct');const txt=ta.value;const fb=()=>{ta.focus();ta.select();toast('글이 선택됐어요. Ctrl+C로 복사하세요')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('복사했어요'),fb);else fb();return}
 case'reset':{const rc=document.getElementById('rc');if(rc)rc.innerHTML=`<div class="confirm" style="margin-top:10px">지금까지의 답과 노선이 모두 지워져요. <button class="btn sm" data-act="resetok">지우고 새로 시작</button><button class="btn ghost sm" data-act="resetno">취소</button></div>`;return}
 case'resetok':S=blank();CACHE=null;top();break;
 case'resetno':{const rc=document.getElementById('rc');if(rc)rc.innerHTML='';return}
 }
 render()});
document.addEventListener('input',e=>{if(e.target.id==='qs'){S.qs=e.target.value;rList();save()}if(e.target.id==='nm'){S.name=e.target.value.trim();save()}});
document.addEventListener('keydown',e=>{if(S.step===1&&S.qStage==='quiz'&&/^[1-5]$/.test(e.key)&&e.target.tagName!=='INPUT'){const b=document.querySelector(`.lik button[data-v="${e.key}"]`);if(b)b.click()}});
render();
</script>
